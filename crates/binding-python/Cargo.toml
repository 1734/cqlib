[package]
name = "binding-python"
# Python 包版本独立于 Rust/C 版本 (对应规则: Python 用 PEP 440, Rust/C 用 semver)。
# 此处必须为合法 semver (如 1.4.0-beta1); maturin 会归一化为 PEP 440 (PyPI 上显示为 1.4.0b1)。
version = "1.4.0-beta1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "_native"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.27", features = ["abi3-py310", "num-complex", "chrono"] }
chrono = "0.4"
cqlib-core = { path = "../cqlib-core", version = '0.1.0-beta.1' }
num-complex.workspace = true
numpy.workspace = true
smallvec.workspace = true
time.workspace = true

[features]
default = []
