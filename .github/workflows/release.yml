# Tag (`v*`) 触发的发布构建 CI。
#
# 职责: 构建、测试、保存产物 —— 不发布任何东西。发布人员从 Actions 下载产物后,
# 手动发布到 PyPI / crates.io / GitHub & Gitee Release。
#
# 规则速览:
#   - Tag 命名: v{Python 版本}, 如 v1.4.0-beta1; check-versions 强制校验 tag 与版本一致
#   - 版本对应: Python (PEP 440, 如 1.4.0-beta1, PyPI 归一化为 1.4.0b1) 与 Rust/C
#     (semver, 如 0.1.0-beta.1) 独立编号, 每次发布通过 tag 建立对应关系。
#     Python 版本 = binding-python/Cargo.toml 的独立 `version`, 由 maturin 读取;
#     Rust/C 版本 = 根 Cargo.toml 的 `[workspace.package] version`。
#     当前对应: Python 1.4.0-beta1 ↔ Rust/C 0.1.0-beta.1
#   - crates.io 发布顺序: cqlib-core → cqlib → binding-c; binding-python 经 PyPI 分发, 不发 crates.io。
#     预发布版本注意: `version = "0.1.0"` 这类要求不会匹配已发布的 `0.1.0-beta.1`
#   - 明确不支持: 32 位、musllinux/Alpine、armv7/s390x/ppc64le/riscv、macOS<11、glibc<2.28、Python<3.10
#
# 产物清单:
#   python-wheels-<platform>  x5 : 每平台一个 abi3-py310 wheel (Python 3.10+)
#   python-sdist                  : sdist (.tar.gz), 并验证可从 sdist 重建 wheel
#   cqlib-c-<triple>          x5 : 每平台一个 C 压缩包 (cqlib_c.h + 静态库 + 动态库 + README + LICENSE)
#   cqlib-core-crate              : cargo package 生成的 .crate (校验可独立编译)
#
# 平台矩阵:
#   Windows x86_64            windows-latest
#   Linux glibc 2.28+ x86_64  ubuntu-24.04     + manylinux_2_28
#   Linux glibc 2.28+ aarch64 ubuntu-24.04-arm + manylinux_2_28
#   macOS 11+ x86_64          macos-15-intel   + MACOSX_DEPLOYMENT_TARGET=11.0
#   macOS 11+ arm64           macos-15         + MACOSX_DEPLOYMENT_TARGET=11.0
#   (macOS 11 已无官方 runner; 仿照 Qiskit wheels-build.yml 的做法:
#    新 runner + 显式 deployment target, 保证 wheel/dylib 最低系统版本为 11.0;
#    macos-15-intel 不可用时可回退 macos-13)
name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check-versions:
    name: Verify tag matches manifest versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify tag ↔ versions
        run: |
          python - <<'EOF'
          import os, tomllib

          tag = os.environ.get("GITHUB_REF_NAME", "")
          ref_type = os.environ.get("GITHUB_REF_TYPE", "")
          root = tomllib.load(open("Cargo.toml", "rb"))
          rust_version = root["workspace"]["package"]["version"]

          def package_version(path):
              # Python 版本 = binding-python 的独立 version (PEP 440 语义, 如 1.4.0-beta1)。
              # 兼容历史写法 version.workspace = true: tomllib 会把 `version.workspace = true`
              # 解析成 dict {"workspace": True}, 此时回落到 workspace 版本。
              pkg = tomllib.load(open(path, "rb"))["package"]
              version = pkg.get("version", rust_version)
              return rust_version if isinstance(version, dict) else version

          py_version = package_version("crates/binding-python/Cargo.toml")
          print(f"tag={tag or '(none)'}  python={py_version}  rust/c={rust_version}")
          if ref_type == "tag":
              assert tag.startswith("v"), f"release tag must start with 'v' (got {tag!r})"
              assert tag[1:] == py_version, (
                  f"tag '{tag}' does not match binding-python version '{py_version}'. "
                  "Tag naming rule: v<Python version>."
              )
          EOF

  python-sdist:
    name: Python sdist
    needs: check-versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist -m crates/binding-python/Cargo.toml
      - name: Verify the sdist builds a wheel
        # 证明 sdist 完整 (含 cqlib-core 路径依赖源码), 从 sdist 重新构建 wheel。
        run: python -m pip wheel --no-deps dist/*.tar.gz -w dist/from-sdist
      - name: Upload sdist
        uses: actions/upload-artifact@v4
        with:
          name: python-sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  python-wheels:
    name: Wheel (${{ matrix.name }})
    needs: check-versions
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x86_64,   runner: ubuntu-24.04,     target: x86_64,  manylinux: '2_28' }
          - { name: linux-aarch64,  runner: ubuntu-24.04-arm, target: aarch64, manylinux: '2_28' }
          - { name: windows-x86_64, runner: windows-latest,   target: x64 }
          - { name: macos-x86_64,   runner: macos-15-intel,   target: x86_64 }
          - { name: macos-arm64,    runner: macos-15,         target: aarch64 }
    steps:
      - uses: actions/checkout@v4
      - name: Set macOS deployment target (macOS 11+)
        # 见文件头注释: macos-11 runner 已下线, 用新 runner + 显式 deployment target,
        # 与 Qiskit wheels-build.yml 的做法一致。
        if: runner.os == 'macOS'
        run: echo "MACOSX_DEPLOYMENT_TARGET=11.0" >> "$GITHUB_ENV"
      - name: Set up Python (Linux / macOS)
        if: runner.os != 'Windows'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set up Python (Windows)
        if: runner.os == 'Windows'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Build wheel (abi3-py310, Python 3.10+)
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist --find-interpreter -m crates/binding-python/Cargo.toml
          sccache: 'true'
          manylinux: ${{ matrix.manylinux }}
      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: python-wheels-${{ matrix.name }}
          path: dist/*.whl
          if-no-files-found: error

  python-verify:
    name: Verify wheel (${{ matrix.name }})
    needs: python-wheels
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x86_64,   runner: ubuntu-24.04 }
          - { name: linux-aarch64,  runner: ubuntu-24.04-arm }
          - { name: windows-x86_64, runner: windows-latest }
          - { name: macos-x86_64,   runner: macos-15-intel }
          - { name: macos-arm64,    runner: macos-15 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # 用声明的最低版本做最强验证: abi3-py310 保证 3.10+ 全兼容
          python-version: '3.10'
      - uses: actions/download-artifact@v4
        with:
          name: python-wheels-${{ matrix.name }}
          path: dist
      - name: Install wheel and test tools
        run: python -m pip install dist/*.whl pytest
      - name: Import check
        run: python -c "import cqlib; from cqlib import Circuit; print('cqlib import OK:', cqlib.__file__)"
      - name: Run binding tests
        run: python -m pytest crates/binding-python/tests/ -q
      - name: Run full Python test suite (Linux x86_64 only)
        if: matrix.name == 'linux-x86_64'
        run: python -m pytest tests/python/ -q

  c-packages:
    name: C package (${{ matrix.triple }})
    needs: check-versions
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04,     triple: x86_64-unknown-linux-gnu }
          - { runner: ubuntu-24.04-arm, triple: aarch64-unknown-linux-gnu }
          - { runner: windows-latest,   triple: x86_64-pc-windows-msvc }
          - { runner: macos-15-intel,   triple: x86_64-apple-darwin }
          - { runner: macos-15,         triple: aarch64-apple-darwin }
    env:
      CQLIB_C_TRIPLE: ${{ matrix.triple }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
      - name: Set C package version
        shell: bash
        run: |
          CQLIB_C_VERSION="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)"
          echo "CQLIB_C_VERSION=$CQLIB_C_VERSION" >> "$GITHUB_ENV"
      - name: Set macOS deployment target (macOS 11+)
        if: runner.os == 'macOS'
        run: echo "MACOSX_DEPLOYMENT_TARGET=11.0" >> "$GITHUB_ENV"

      # ---- Linux: 在 manylinux_2_28 容器内构建, 保证 glibc 2.28 兼容 ----
      - name: Build, test and package (Linux, glibc 2.28)
        if: runner.os == 'Linux'
        env:
          MANYLINUX_IMAGE: ${{ matrix.triple == 'x86_64-unknown-linux-gnu' && 'manylinux_2_28_x86_64' || 'manylinux_2_28_aarch64' }}
        run: |
          docker run --rm \
            -e CQLIB_C_VERSION -e CQLIB_C_TRIPLE \
            -v "$PWD:/io" -w /io \
            "quay.io/pypa/$MANYLINUX_IMAGE" \
            bash -euxo pipefail -c '
              curl --proto "=https" --tlsv1.2 -sSf https://sh.rustup.rs \
                | sh -s -- -y --profile minimal --default-toolchain 1.85
              export PATH="$HOME/.cargo/bin:$PATH"
              cargo build --release --locked -p binding-c
              gcc crates/binding-c/tests/test_circuit.c -I crates/binding-c/include \
                -o /tmp/test_circuit_static target/release/libbinding_c.a -lm -lpthread -ldl
              /tmp/test_circuit_static
              gcc crates/binding-c/tests/test_circuit.c -I crates/binding-c/include \
                -o /tmp/test_circuit_dynamic -L target/release -lbinding_c -lm -lpthread -ldl \
                -Wl,-rpath,/io/target/release
              /tmp/test_circuit_dynamic
              pkg="cqlib_c-${CQLIB_C_VERSION}-${CQLIB_C_TRIPLE}"
              mkdir -p "dist/${pkg}/include" "dist/${pkg}/lib"
              cp crates/binding-c/include/cqlib_c.h "dist/${pkg}/include/"
              cp target/release/libbinding_c.a target/release/libbinding_c.so "dist/${pkg}/lib/"
              cp crates/binding-c/README.md LICENSE.txt "dist/${pkg}/"
              tar -czf "dist/${pkg}.tar.gz" -C dist "${pkg}"
            '

      # ---- macOS ----
      - name: Build, test and package (macOS)
        if: runner.os == 'macOS'
        run: |
          cargo build --release --locked -p binding-c
          cc crates/binding-c/tests/test_circuit.c -I crates/binding-c/include \
            -o test_circuit_static target/release/libbinding_c.a -framework CoreFoundation
          ./test_circuit_static
          cc crates/binding-c/tests/test_circuit.c -I crates/binding-c/include \
            -o test_circuit_dynamic -L target/release -lbinding_c \
            -Wl,-rpath,"$PWD/target/release"
          ./test_circuit_dynamic
          pkg="cqlib_c-${CQLIB_C_VERSION}-${CQLIB_C_TRIPLE}"
          mkdir -p "dist/${pkg}/include" "dist/${pkg}/lib"
          cp crates/binding-c/include/cqlib_c.h "dist/${pkg}/include/"
          cp target/release/libbinding_c.a target/release/libbinding_c.dylib "dist/${pkg}/lib/"
          cp crates/binding-c/README.md LICENSE.txt "dist/${pkg}/"
          tar -czf "dist/${pkg}.tar.gz" -C dist "${pkg}"

      # ---- Windows ----
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
        with:
          arch: x64
      - name: Build, test and package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo build --release --locked -p binding-c
          cl /nologo /I crates/binding-c/include crates/binding-c/tests/test_circuit.c `
            target/release/binding_c.lib ws2_32.lib userenv.lib advapi32.lib bcrypt.lib `
            /Fe:test_circuit_static.exe
          .\test_circuit_static.exe
          cl /nologo /I crates/binding-c/include crates/binding-c/tests/test_circuit.c `
            target/release/binding_c.dll.lib ws2_32.lib userenv.lib advapi32.lib bcrypt.lib `
            /Fe:test_circuit_dynamic.exe
          Copy-Item target/release/binding_c.dll .
          .\test_circuit_dynamic.exe
          $pkg = "cqlib_c-$env:CQLIB_C_VERSION-$env:CQLIB_C_TRIPLE"
          New-Item -ItemType Directory -Force -Path "dist/$pkg/include", "dist/$pkg/lib" | Out-Null
          Copy-Item crates/binding-c/include/cqlib_c.h "dist/$pkg/include/"
          Copy-Item target/release/binding_c.lib, target/release/binding_c.dll "dist/$pkg/lib/"
          Copy-Item target/release/binding_c.dll.lib "dist/$pkg/lib/" -ErrorAction SilentlyContinue
          Copy-Item crates/binding-c/README.md, LICENSE.txt "dist/$pkg/"
          Compress-Archive -Path "dist/$pkg" -DestinationPath "dist/$pkg.zip"

      - name: Upload C package
        uses: actions/upload-artifact@v4
        with:
          name: cqlib-c-${{ matrix.triple }}
          path: |
            dist/cqlib_c-*.tar.gz
            dist/cqlib_c-*.zip
          if-no-files-found: error

  rust-crate:
    name: cqlib-core .crate package
    needs: check-versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
      - name: cargo package (构建并校验打包内容)
        # 注意: 当前 cqlib-core 的 include 清单缺 build.rs、src/ir/qasm2/parser.lalrpop、
        # src/compile/knowledge/rules/*.rule 和 LICENSE.txt, 打包产物无法独立编译,
        # 因此本步骤 (cargo package 自带 verify 构建) 会失败。修好 include 清单后才会通过。
        run: cargo package --locked -p cqlib-core
      - name: Verify the .crate compiles standalone
        # 解开 .crate, 只用包内源码 + crates.io 依赖重新构建, 证明可独立编译。
        run: |
          mkdir -p /tmp/crate-check
          tar -xzf target/package/cqlib-core-*.crate -C /tmp/crate-check
          cd /tmp/crate-check/cqlib-core-*
          export CARGO_TARGET_DIR="$GITHUB_WORKSPACE/target/crate-check"
          cargo build --locked
      - name: Upload .crate
        uses: actions/upload-artifact@v4
        with:
          name: cqlib-core-crate
          path: target/package/*.crate
          if-no-files-found: error
