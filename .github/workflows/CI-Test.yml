# 测试流水线：Rust 单元测试 + Python 绑定测试
# 与 CI-Python.yml 分工：那个文件管打包/发布（maturin 自动生成），这个文件管测试
name: CI-Test

on:
  # push 不限定分支：所有分支的 push 都触发测试
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ---- Rust 侧测试 ----
  rust-tests:
    name: Rust tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          # 各 crate 共享一份缓存
          workspaces: . -> target
      - name: Run Rust tests
        run: cargo test --all

  # ---- Python 侧测试 ----
  python-tests:
    name: Python tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      # 一个版本挂了不取消另一个版本的运行
      fail-fast: false
      matrix:
        python-version: ['3.10']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
      - name: Install build and test tools
        run: python -m pip install -U pip maturin pytest numpy
      - name: Build and install local extension
        # 把本地 Rust 源码编译成原生扩展装进当前环境
        run: maturin develop -m crates/binding-python/Cargo.toml
      - name: Run main Python test suite
        run: pytest tests/python/
      - name: Run binding Python tests
        run: pytest crates/binding-python/tests/
