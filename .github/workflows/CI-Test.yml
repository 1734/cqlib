name: CI-Test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust-tests:
    name: Rust tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
      - name: Run Rust tests
        run: cargo test --all

  python-tests:
    name: Python tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
      - name: Create virtualenv
        run: python -m venv .venv
      - name: Install build and test tools
        run: .venv/bin/python -m pip install -U pip maturin pytest numpy
      - name: Build and install local extension
        run: .venv/bin/maturin develop -m crates/binding-python/Cargo.toml
      - name: Run main Python test suite
        run: .venv/bin/pytest tests/python/
      - name: Run binding Python tests
        run: .venv/bin/pytest crates/binding-python/tests/
